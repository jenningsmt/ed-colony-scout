name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Nothing under test needs Tk or Windows -- the GUI-instantiating checks
    # done during development stay a manual/local verification technique
    # (see USE_EXAMPLE.md-style workflows), not part of this suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests -v
