name: Monitor release downloads

on:
  schedule:
    # Run at 17 minutes past every hour.
    # Choosing a non-zero minute can reduce congestion around the top of the hour.
    - cron: "17 * * * *"

  # Also permit manual testing from the Actions page.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-download-monitor
  cancel-in-progress: false

jobs:
  check-downloads:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check release download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/scripts/check_release_downloads.py

      - name: Save updated download counts
        run: |
          if git diff --quiet -- .github/release-download-counts.json; then
            echo "Download counts have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/release-download-counts.json
          git commit -m "Update release download counts"
          git push