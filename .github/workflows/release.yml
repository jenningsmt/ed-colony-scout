name: Release

# Triggered by pushing a version tag (e.g. `git tag v1.0.0 && git push origin
# v1.0.0`), matching this repo's existing tagging convention. Tests gate the
# build -- a release is never published from a failing test suite.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build executable
        run: pyinstaller packaging/ed_colony_scout.spec --clean

      - name: Build installer
        run: iscc packaging/installer.iss

      - name: Compute SHA-256 checksum
        id: checksum
        run: |
          $installer = Get-ChildItem "dist-installer\ED-Colony-Scout-Setup-*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.checksum.outputs.path }}
          generate_release_notes: true
          body: |
            ### Verify your download

            SHA-256 checksum of `${{ steps.checksum.outputs.name }}`:

            ```
            ${{ steps.checksum.outputs.sha256 }}
            ```

            Verify with PowerShell after downloading:
            ```
            Get-FileHash .\${{ steps.checksum.outputs.name }} -Algorithm SHA256
            ```

            The installer is unsigned -- see the README's
            [Antivirus and SmartScreen warnings](../../blob/main/README.md#antivirus-and-smartscreen-warnings)
            section for what to expect and how to verify the file is genuine.
